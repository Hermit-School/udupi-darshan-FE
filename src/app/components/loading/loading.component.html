<div
  id="loading-animation"
  class="loading"
  role="status"
  aria-live="polite"
  aria-label="Loading content"
  style="display: none"
>
  <div class="loading-card">
    <div class="loading-art" aria-hidden="true">
      <span class="orbit orbit-one"></span><span class="orbit orbit-two"></span
      ><img
        src="assets/images/static/temple.svg"
        alt=""
        width="82"
        height="66"
      />
    </div>
    <div class="loading-copy">
      <img
        class="loading-logo"
        src="assets/images/static/horizontal_logo.svg"
        alt="Udupi Darshan"
        width="170"
        height="38"
      />
      <p>
        Getting things ready for you<span
          class="loading-dots"
          aria-hidden="true"
          ><b>·</b><b>·</b><b>·</b></span
        >
      </p>
    </div>
    <span class="loading-track" aria-hidden="true"></span>
  </div>
</div>
