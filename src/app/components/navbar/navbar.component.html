<button type="button" class="skip-link" (click)="skipToContent()">
  Skip to content
</button>
<nav class="navbar navbar-expand-lg sticky-top custom-navbar-height">
  <div class="container-fluid">
    <a class="navbar-brand brand-margin" href="#" routerLink="/home">
      <img
        src="assets/images/static/horizontal_logo.svg"
        alt="Udupi Darshan Logo"
        style="height: 30px"
      />
    </a>

    <button
      class="navbar-toggler d-lg-none"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#offcanvasNavbar"
      aria-controls="offcanvasNavbar"
      aria-label="Open navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div
      class="collapse navbar-collapse d-none d-lg-flex"
      id="navbarTogglerDemo02"
    >
      <ul class="navbar-nav me-auto align-items-lg-center">
        <!-- F026 FE BY sulaxmi(from) -->
        <li class="nav-item">
          <a
            class="nav-link"
            [ngClass]="{ 'active-link': isRouteActive('/nature') }"
            routerLink="/nature"
            [attr.aria-current]="isRouteActive('/nature') ? 'page' : null"
            >Nature</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link ms-lg-3 ms-xl-5"
            [ngClass]="{ 'active-link': isRouteActive('/culture') }"
            routerLink="/culture"
            [attr.aria-current]="isRouteActive('/culture') ? 'page' : null"
            href="#"
            >Culture</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link ms-lg-3 ms-xl-5"
            routerLink="/food"
            [attr.aria-current]="isRouteActive('/food') ? 'page' : null"
            [ngClass]="{ 'active-link': isRouteActive('/food') }"
            href="#"
            >Food</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link ms-lg-3 ms-xl-5"
            routerLink="/story"
            routerLinkActive="active-link"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: false }"
            href="#"
            >Stories</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link ms-lg-3 ms-xl-5"
            routerLink="/advertisements"
            routerLinkActive="active-link"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: false }"
            href="#"
            >Local ads</a
          >
        </li>
        <li class="nav-item"><a class="nav-link ms-lg-3" routerLink="/events" routerLinkActive="active-link" (click)="closeOffcanvas()">Events</a></li>
        <li class="nav-item">
          <button
            class="btn ms-lg-3 ms-xl-5"
            type="button"
            (click)="openStoryForm()"
          >
            Write to us
          </button>
        </li>
      </ul>
    </div>
  </div>
  <!-- TO -->

  <div
    class="offcanvas offcanvas-end d-lg-none d-block"
    tabindex="-1"
    id="offcanvasNavbar"
    #mobileMenu
    aria-labelledby="offcanvasNavbarLabel"
  >
    <div class="offcanvas-header">
      <h5 id="offcanvasNavbarLabel">Explore Udupi</h5>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="offcanvas"
        aria-label="Close navigation"
      ></button>
    </div>
    <div class="offcanvas-body">
      <ul class="navbar-nav me-auto align-items-lg-center">
        <li class="nav-item">
          <a
            class="nav-link color"
            routerLink="/nature"
            [attr.aria-current]="isRouteActive('/nature') ? 'page' : null"
            href="#"
            (click)="closeOffcanvas()"
            >Nature</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link color"
            routerLink="/culture"
            [attr.aria-current]="isRouteActive('/culture') ? 'page' : null"
            href="#"
            (click)="closeOffcanvas()"
            >Culture</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link color"
            routerLink="/food"
            [attr.aria-current]="isRouteActive('/food') ? 'page' : null"
            href="#"
            (click)="closeOffcanvas()"
            >Food</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link color"
            routerLink="/story"
            href="#"
            (click)="closeOffcanvas()"
            >Stories</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link color"
            routerLink="/advertisements"
            href="#"
            (click)="closeOffcanvas()"
            >Local ads</a
          >
        </li>
        <li class="nav-item"><a class="nav-link ms-lg-3" routerLink="/events" routerLinkActive="active-link" (click)="closeOffcanvas()">Events</a></li>
        <li class="nav-item">
          <button class="btn" type="button" (click)="openStoryForm()">
            Write to us
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<ng-template #storyForm let-dialog>
  <app-story-submission
    (busy)="submittingStory = $event"
    (close)="dialog.dismiss()"
  ></app-story-submission>
</ng-template>
