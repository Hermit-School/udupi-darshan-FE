<div class="container-fluid p-0">
  <ngb-carousel [showNavigationIndicators]="true">
    <ng-template ngbSlide *ngFor="let image of images; let i = index">
      <div class="carousel-item-wrapper">
        <img [attr.loading]="i === 0 ? 'eager' : 'lazy'" [attr.fetchpriority]="i === 0 ? 'high' : 'low'" decoding="async" [src]="image.src" [attr.srcset]="i === 0 ? 'assets/images/a6-480.jpg 480w, assets/images/a6.jpg 800w' : null" sizes="100vw" alt="Slide image" class="d-block w-100 fit-screen-img" />
      </div>
      <div class="carousel-caption">
        <p class="text-white">{{ image.description }}</p>
      </div>
    </ng-template>
  </ngb-carousel>
</div>
