<main class="access" aria-labelledby="admin-title">
  <div class="access-shell">
    <aside class="brand">
      <img src="assets/images/static/horizontal_logo.svg" alt="Udupi Darshan" class="brand-logo">
      <span class="eyebrow">ADMIN WORKSPACE</span>
      <img class="temple" src="assets/images/static/temple.svg" alt="" width="316" height="186">
    </aside>

    <section class="sign-in">
      <a class="back" routerLink="/home"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to public site</a>
      <h1 id="admin-title">Admin sign in</h1>
      <p class="intro">Enter your username and password to open the dashboard.</p>
      @if (accessRequired && !error) {
        <p class="notice" role="status">Sign in as an administrator to open this page.</p>
      }
      @if (error) {
        <p class="notice" role="alert"><i class="bi bi-exclamation-circle" aria-hidden="true"></i> {{ error }}</p>
      }
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" [attr.aria-busy]="busy">
        <label for="username">Username</label>
        <input id="username" formControlName="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="password">Password</label>
        <div class="password">
          <input id="password" formControlName="password" [type]="showPassword ? 'text' : 'password'" autocomplete="current-password" required>
          <button type="button" class="toggle" (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        <button type="submit" class="primary" [disabled]="busy || loginForm.invalid">
          {{ busy ? 'Signing in…' : 'Sign in' }}
          <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </button>
      </form>
      <a class="help" routerLink="/forgotpassword">Need help signing in?</a>
    </section>
  </div>
</main>
