<div class="container-fluid d-flex justify-content-center align-items-center">
  <div class="card"><div class="card-body">
    <h2 class="text-center text"><i class="bi bi-person-lock" aria-hidden="true"></i> Admin sign in</h2>
    <p role="alert" class="alert alert-danger" *ngIf="error">{{ error }}</p>
    <form *ngIf="phase === 'credentials'" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label for="username">Username</label>
      <input id="username" class="form-control mb-3" formControlName="username" autocomplete="username" required>
      <label for="password">Password</label>
      <div class="input-group mb-3">
        <input id="password" class="form-control" formControlName="password" [type]="showPassword ? 'text' : 'password'" autocomplete="current-password" required>
        <button type="button" class="btn btn-outline-secondary" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">{{ showPassword ? 'Hide' : 'Show' }}</button>
      </div>
      <button type="submit" class="btn btn-dark-orange w" [disabled]="busy || loginForm.invalid">{{ busy ? 'Sending code…' : 'Send sign-in code' }}</button>
      <a routerLink="/forgotpassword" class="d-block mt-3">Need help signing in?</a>
    </form>
    <form *ngIf="phase === 'otp'" [formGroup]="otpForm" (ngSubmit)="verify()">
      <p>A six-digit code was sent to your account’s email address. It expires in five minutes.</p>
      <label for="otp">Email verification code</label>
      <input id="otp" class="form-control mb-3" formControlName="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
      <button type="submit" class="btn btn-dark-orange w" [disabled]="busy || otpForm.invalid">{{ busy ? 'Verifying…' : 'Verify and sign in' }}</button>
      <button type="button" class="btn btn-link mt-3" [disabled]="busy" (click)="restart()">Request a new code or change account</button>
    </form>
    <a routerLink="/home" class="d-block mt-3">Back to public site</a>
  </div></div>
</div>
