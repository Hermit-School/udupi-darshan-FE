# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v4
      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm install, build
        run: |
          npm ci
          npm run verify
      - name: Install Firebase CLI
        run: |  
          npm install -g firebase-tools@15.34.2 --no-audit --no-fund
          firebase --version
      - name: Configure Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UDUPI_DARSHAN }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          credential = Path(os.environ['RUNNER_TEMP']) / 'firebase-service-account.json'
          credential.write_text(os.environ['FIREBASE_SERVICE_ACCOUNT_JSON'])
          credential.chmod(0o600)
          PY
      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only hosting --non-interactive
